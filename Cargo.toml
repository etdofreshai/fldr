[workspace]
resolver = "3"
members = [
    "crates/fldr-core",
    "crates/fldr-store",
    "crates/fldr-server",
    "crates/fldr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/etdofreshai/fldr"
publish = false

[workspace.dependencies]
fldr-core = { path = "crates/fldr-core" }
fldr-store = { path = "crates/fldr-store" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = { version = "1.12", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4.3"
http-body-util = "0.1.5"
proptest = "1.12"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "json",
    "uuid",
    "time",
] }
tempfile = "3.27"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "cors", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
zstd = "0.14.3"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep target/ small: per-worktree builds add up quickly.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
