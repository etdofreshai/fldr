# Parked here because the token that pushed M0 lacked GitHub's `workflow`
# scope. Activate with:
#   git mv ci/github-actions-ci.yml .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fldr
          POSTGRES_PASSWORD: fldr
          POSTGRES_DB: fldr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fldr -d fldr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Enables the server's gated Postgres integration test. The credentials
      # belong to the throwaway service container above.
      FLDR_TEST_DATABASE_URL: postgres://fldr:fldr@localhost:5432/fldr_test

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features
