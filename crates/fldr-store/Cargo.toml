[package]
name = "fldr-store"
description = "Immutable, content-addressed object storage for fldr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes `fldr_store::testing`, the BlobStore conformance suite.
testing = []

[dependencies]
fldr-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
# Self dev-dependency so this crate's own tests get the `testing` feature.
fldr-store = { path = ".", features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
